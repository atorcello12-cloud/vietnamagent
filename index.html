<style>
/* Layout: a phone-first app shell — scrolling glass panels above a fixed bottom tab bar, floating over a live night scene of Hoi An's lantern river. Single night theme by design. */
:root {
  color-scheme: dark;
  --paper: #3A2A2E;        /* river at dusk */
  --card: rgba(32,20,20,.84);
  --ink: #FFF8EF;
  --muted: #E8DACB;
  --line: rgba(255,232,205,.26);
  --jade: #5CC9A7;
  --jade-soft: rgba(92,201,167,.15);
  --lantern: #F5B544;      /* Hoi An lantern saffron */
  --lantern-soft: rgba(245,181,68,.17);
  --lotus: #F08BA8;        /* lotus pink */
  --lotus-soft: rgba(240,139,168,.16);
  --sea: #7CC0E6;
  --sea-soft: rgba(124,192,230,.15);
  --warn: #F6A35F;
  --warn-soft: rgba(246,163,95,.16);
  --shadow: 0 1px 3px rgba(20,8,5,.45), 0 10px 28px rgba(20,8,5,.4);
  --hero-bg: rgba(36,22,20,.78);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.app { position: relative; z-index: 1; }
.card, .pass, .meal-h, .tabs, .filters button { -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
.card, .pass, .meal-h { border: 1px solid var(--line); }
.section-head, .route > .eyebrow { text-shadow: 0 1px 3px rgba(20,8,6,.9), 0 2px 14px rgba(20,8,6,.8); }
.hero { border: 1px solid var(--line); }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
.app { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--jade); }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.vn { font-family: var(--f-display); font-weight: 500; color: var(--jade); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.view { display: flex; flex-direction: column; gap: 22px; }
.section-head { display: flex; flex-direction: column; gap: 4px; }

/* Hero */
.hero { position: relative; overflow: hidden; background: var(--hero-bg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #F4F8F6; border-radius: 20px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .eyebrow { color: rgba(244,248,246,.75); }
.hero h1 { color: #FFFFFF; max-width: 12ch; }
.hero-lanterns { position: absolute; right: 10px; top: -6px; width: 120px; height: auto; pointer-events: none; }
.count { display: flex; gap: 10px; flex-wrap: wrap; }
.count div { background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 16px; min-width: 78px; }
.count b { display: block; font: 700 2rem/1 var(--f-mono); font-variant-numeric: tabular-nums; color: #FFFFFF; }
.count span { font-size: .82rem; color: rgba(244,248,246,.85); }
.hero small { color: rgba(244,248,246,.9); font-size: .95rem; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .78rem; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.chip.raffy { background: var(--lantern-soft); border-color: transparent; }
.chip.parents { background: var(--lotus-soft); border-color: transparent; }
.chip.easy { background: var(--jade-soft); border-color: transparent; }
.chip.beach { background: var(--sea-soft); border-color: transparent; }
.chip.adults { background: var(--paper); }

.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.alert { background: var(--warn-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.alert h3 { color: var(--warn); }

/* Route */
.route { position: relative; display: flex; flex-direction: column; gap: 14px; padding-left: 28px; }
.route::before { content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: repeating-linear-gradient(var(--jade) 0 8px, transparent 8px 14px); opacity: .5; }
.stop { position: relative; }
.stop::before { content: ""; position: absolute; left: -26px; top: 18px; width: 15px; height: 15px; border-radius: 50%; background: var(--card); border: 3px solid var(--jade); }
.stop.now::before { background: var(--lantern); border-color: var(--lantern); box-shadow: 0 0 0 5px var(--lantern-soft); }
.stop-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box; }
.stop-btn:focus-visible { outline: 2px solid var(--jade); outline-offset: 4px; border-radius: 8px; }
.stop-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.dates { font: 500 .78rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.tbc { font: 700 .66rem var(--f-mono); letter-spacing: .06em; color: var(--warn); background: var(--warn-soft); padding: 2px 6px; border-radius: 6px; }
.weather { font-size: .82rem; color: var(--muted); }
.stay { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .84rem; color: var(--lantern); }
.stay b { font-weight: 600; color: var(--ink); }
.stay span { color: var(--muted); }
.stay span::before { content: "· "; }
.suggest { font-size: .8rem; font-style: italic; color: var(--lantern); }
.idea { width: fit-content; font: 600 .62rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--lantern); border: 1px solid var(--lantern); border-radius: 999px; padding: 1px 7px; }
.stay-warn { font-size: .8rem; color: var(--warn); background: var(--warn-soft); padding: 6px 10px; border-radius: 8px; }
.chev { transition: transform .2s; color: var(--muted); }
.stop[open] .chev { transform: rotate(90deg); }
.stop-body { display: none; flex-direction: column; gap: 12px; padding-top: 6px; }
.stop[open] .stop-body { display: flex; }

.day { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.day-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.slot { display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
.slot-t { font: 500 .72rem var(--f-mono); color: var(--muted); padding-top: 3px; text-transform: uppercase; letter-spacing: .04em; }
.slot-b { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.slot-b b { font-weight: 600; }
.flightpill { display: inline-flex; gap: 6px; align-items: center; font: 700 .74rem var(--f-mono); color: var(--sea); background: var(--sea-soft); padding: 3px 8px; border-radius: 6px; width: fit-content; }

/* Boarding passes */
.pass { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.pass-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--jade-soft); gap: 10px; }
.pass-top .num { font: 700 .95rem var(--f-mono); color: var(--jade); }
.pass-main { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 16px; }
.iata { font: 700 2rem/1 var(--f-mono); letter-spacing: -.02em; }
.pass-main .r { text-align: right; }
.pass-main .t { font: 500 .95rem var(--f-mono); }
.pass-main .c { font-size: .78rem; color: var(--muted); }
.plane { color: var(--muted); }
.mid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dur { font: 600 .72rem var(--f-mono); color: var(--lantern); white-space: nowrap; }
.tear { border-top: 2px dashed var(--line); margin: 0 16px; }
.pass-foot { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { display: flex; flex-direction: column; }
.kv span { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv b { font: 600 .9rem var(--f-mono); font-variant-numeric: tabular-nums; }
.pass.pending { opacity: .85; }
.pass.pending .pass-top { background: var(--warn-soft); }
.pass.pending .pass-top .num { color: var(--warn); }

.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px; font: 600 .85rem var(--f-body); background: var(--jade); color: var(--paper); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--jade); border: 1.5px solid var(--jade); }
.btn:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.reveal { all: unset; cursor: pointer; font: 600 .9rem var(--f-mono); color: var(--jade); border-bottom: 1px dashed var(--jade); }

/* Filters */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters button { all: unset; cursor: pointer; white-space: nowrap; padding: 7px 14px; border-radius: 999px; font: 600 .82rem var(--f-body); background: var(--card); border: 1px solid var(--line); color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters button:focus-visible { outline: 2px solid var(--jade); }

.meal { display: flex; flex-direction: column; gap: 12px; }
.meal-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.meal-h .dates { margin-left: auto; }
.spot { gap: 8px; }
.famous { display: flex; flex-direction: column; gap: 1px; padding: 10px 12px; border-radius: 10px; background: var(--lantern-soft); }
.famous .vn { font-size: 1.1rem; font-weight: 700; }
.famous .muted { font-size: .85rem; }
.spot .where { font-size: .84rem; color: var(--muted); }
/* Tiles and tap-to-reveal cards */
.tiles { display: grid; gap: 10px; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
.tiles.two { grid-template-columns: repeat(2, 1fr); }
.tiles.two > .tile:last-child:nth-child(odd) { grid-column: span 2; aspect-ratio: auto; min-height: 96px; }
.tile { --g1: #E9A86B; --g2: #9C5B3B; all: unset; box-sizing: border-box; cursor: pointer; position: relative; overflow: hidden; aspect-ratio: 1; max-width: 100%; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; padding: 14px; border-radius: 18px; color: #FFF8EE;
  background: linear-gradient(180deg, rgba(20,10,8,0) 35%, rgba(20,10,8,.45) 100%), radial-gradient(120% 90% at 0% 0%, rgba(255,240,210,.35), transparent 55%), linear-gradient(145deg, var(--g1), var(--g2));
  border: 1px solid rgba(255,235,210,.25); box-shadow: 0 6px 18px rgba(40,15,10,.3); transition: transform .15s, box-shadow .15s; }
.tiles.two .tile { aspect-ratio: 1.25; }
.tile > svg { position: relative; width: 30px; height: 30px; color: #FFF3DD; }
svg .fill { fill: currentColor; fill-opacity: .28; stroke: none; }
.tile > svg { width: 34px; height: 34px; }
.tile-art { position: absolute; right: -14%; bottom: -16%; width: 72%; opacity: .16; pointer-events: none; transform: rotate(-12deg); }
.tile-art svg { width: 100%; height: auto; color: #FFFFFF; display: block; stroke-width: 1.2; }
.tile > span:last-child { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font: 700 1.02rem/1.15 var(--f-display); color: #FFFFFF; text-shadow: 0 1px 6px rgba(40,15,10,.35); }
.tile small { font-size: .72rem; color: rgba(255,246,232,.85); }
.tile em { font-style: normal; font-size: .7rem; line-height: 1.3; color: rgba(255,246,232,.75); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.tiles.three .tile em { display: none; }
.tile:active { transform: scale(.97); }
.tile[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--lantern), 0 8px 22px rgba(40,15,10,.35); }
.tile[data-k="b"] { --g1: #F6B26B; --g2: #D9694F; }
.tile[data-k="l"] { --g1: #E9C46A; --g2: #3F8F86; }
.tile[data-k="d"] { --g1: #7A62A8; --g2: #2B2650; }
.tile[data-k="m"] { --g1: #C4384A; --g2: #5A1424; }
.tile[data-k="raffy"] { --g1: #F7A072; --g2: #D9567F; }
.tile[data-k="relax"] { --g1: #5FB3A1; --g2: #2A6F80; }
.tile[data-k="active"] { --g1: #86AD62; --g2: #3B6646; }
.tile[data-k="sights"] { --g1: #D9A05B; --g2: #8E4E33; }
.tile[data-k="shop"] { --g1: #E57A9C; --g2: #8A4790; }
.tile[data-k="taste"] { --g1: #F0A35A; --g2: #B44D3F; }
.tile[data-k="night"] { --g1: #5B5EA6; --g2: #23244A; }
.tile[data-k="drinks"] { --g1: #E07A5F; --g2: #6E3A63; }
.tile[data-k="local"] { --g1: #C7A46A; --g2: #5F7F5C; }
.tile:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.list-h { display: flex; align-items: baseline; gap: 10px; padding-top: 4px; scroll-margin-top: 12px; text-shadow: 0 1px 3px rgba(20,8,6,.9), 0 2px 14px rgba(20,8,6,.8); }
.hint { font-size: .85rem; color: var(--ink); text-align: center; text-shadow: 0 1px 3px rgba(20,8,6,.9), 0 2px 14px rgba(20,8,6,.8); }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; border-radius: 8px; }
.chev-d { flex: none; color: var(--muted); transition: transform .2s; }
details[open] > summary .chev-d { transform: rotate(90deg); }
.spot > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sum { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.spot .sum .vn { font-size: .95rem; }
.mich { width: fit-content; font: 700 .62rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: #FFD9DE; background: rgba(196,56,74,.35); border: 1px solid rgba(255,140,155,.5); padding: 2px 7px; border-radius: 999px; margin-top: 2px; }
.mich.star { color: #FFE9B0; background: rgba(196,56,74,.6); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.best { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 18px; background: linear-gradient(145deg, rgba(196,56,74,.35), rgba(48,32,30,.75)); border: 1px solid rgba(255,140,155,.4); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.best-h { display: flex; flex-direction: column; gap: 1px; }
.best-h b { font: 700 1.05rem var(--f-display); }
.best-h .muted { font-size: .76rem; }
.best-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.best-card { all: unset; box-sizing: border-box; cursor: pointer; flex: none; width: 150px; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.best-card b { font: 700 .92rem/1.2 var(--f-display); }
.best-card .vn { font-size: .78rem; }
.best-card .cost { margin-left: 0; margin-top: 4px; }
.best-card:focus-visible { outline: 2px solid var(--lantern); }
.best-r { font: 700 .74rem var(--f-mono); color: #CFF5E6; }
.best-r small { font-weight: 500; opacity: .75; }
.badges .mich { margin-top: 0; }
.gstar { width: fit-content; font: 700 .62rem var(--f-mono); letter-spacing: .04em; color: var(--muted); background: rgba(255,255,255,.08); border: 1px solid var(--line); padding: 2px 7px; border-radius: 999px; }
.gstar.hi { color: #CFF5E6; background: rgba(92,201,167,.2); border-color: rgba(92,201,167,.5); }
.gstar small { font-size: .58rem; opacity: .8; }
.mich-h { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 0; text-shadow: 0 1px 3px rgba(20,8,6,.9), 0 2px 14px rgba(20,8,6,.8); }
.mich-h .muted { font-size: .82rem; }
.famous-s { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.famous-s .eyebrow { font-size: .62rem; color: var(--lantern); }
.cost { flex: none; margin-left: auto; font: 600 .78rem var(--f-mono); color: var(--lantern); background: var(--lantern-soft); padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
.cost small { font-size: .66rem; color: var(--muted); }
.cost.free { color: var(--jade); background: var(--jade-soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tr-dir { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tr-dir button { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 8px 6px; border-radius: 10px; font: 600 .8rem var(--f-body); border: 1px solid var(--line); color: var(--muted); }
.tr-dir button[aria-pressed="true"] { background: var(--lantern-soft); border-color: var(--lantern); color: var(--ink); }
.tr-dir button:focus-visible { outline: 2px solid var(--lantern); }
#tr-in { width: 100%; font: 500 1rem/1.4 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(0,0,0,.25); color: var(--ink); resize: vertical; }
#tr-in:focus { outline: none; border-color: var(--lantern); }
.tr-out { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; padding: 12px; border-radius: 12px; background: var(--lantern-soft); }
.tr-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.speak-btn { background: var(--lantern-soft); color: var(--lantern); text-decoration: none; }
.speak-btn[hidden] { display: none !important; }
.tr-big { font-size: 1.3rem; line-height: 1.35; font-weight: 600; color: var(--ink); }
.tr-big.vn { color: var(--ink); }
.kit-group { display: flex; flex-direction: column; gap: 6px; }
.kit-group + .kit-group { padding-top: 6px; }
.kit-group .eyebrow { color: var(--lantern); }
.kit-row { font-size: .88rem; line-height: 1.5; }
.btn.sm { width: fit-content; padding: 7px 12px; font-size: .8rem; }
.place-links { gap: 6px; }
/* Weather */
.wx-ico { width: 26px; height: 26px; color: var(--lantern); flex: none; }
.wx-ico.big { width: 54px; height: 54px; }
.wx-now { display: flex; align-items: center; gap: 14px; }
.wx-temp { font: 700 2.4rem/1 var(--f-display); }
.wx-days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.wx-day { flex: none; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); font-size: .78rem; font-variant-numeric: tabular-nums; }
.wx-day.here { background: var(--lantern-soft); border-color: var(--lantern); }
.wx-dow { font-weight: 600; }
.wx-date { font: 500 .66rem var(--f-mono); color: var(--muted); }
.wx-rain { font: 600 .68rem var(--f-mono); color: var(--sea); }
.wx-legend { display: flex; align-items: center; gap: 6px; font-size: .74rem; color: var(--muted); }
.wx-key { width: 12px; height: 12px; border-radius: 3px; background: var(--lantern-soft); border: 1px solid var(--lantern); }

    { city: 'dad', meal: 'b', place: 'Mì Quảng 1A', area: '1A Hải Phòng, Hải Châu', dish: 'Mì Quảng gà', en: 'Turmeric noodles with chicken', note: 'Serving since the 1970s. Locals rate it the benchmark mì Quảng in the city.', tags: ['parents'] },
    { city: 'dad', meal: 'b', place: 'Chợ Cồn', area: 'Hùng Vương & Ông Ích Khiêm', dish: 'Market food stalls', en: 'Bánh bèo, bánh xèo, chè', note: 'Da Nang\'s locals\' market, not a tourist market. The food hall is cheap and lively.', tags: ['raffy','parents'] },
    { city: 'dad', meal: 'l', place: 'Quán Mậu', area: '35 Đỗ Thúc Tịnh, Cẩm Lệ', dish: 'Bánh tráng cuốn thịt heo', en: 'Boiled pork rolled in rice paper with herbs', note: 'The city\'s signature dish, done the Đại Lộc way. Roll your own with mắm nêm dipping sauce. Great for a group.', tags: ['raffy','parents'] },
    { city: 'dad', meal: 'l', place: 'Bánh Xèo Bà Dưỡng', area: 'Alley 280 Hoàng Diệu, Hải Châu', dish: 'Bánh xèo miền Trung', en: 'Small crispy central-style pancakes', note: 'Hidden at the end of an alley, and every Da Nang taxi driver knows it. The peanut-liver dipping sauce is the star.', tags: ['raffy','parents'] },
    { city: 'dad', meal: 'l', place: 'Mì Quảng Bà Mua', area: '19 Trần Bình Trọng, Hải Châu', dish: 'Mì Quảng tôm thịt', en: 'Turmeric noodles with prawn and pork', note: 'A reliable local chain with air-conditioning. An easy lunch with a toddler.', tags: ['raffy','easy'] },

    { city: 'dad', meal: 'd', place: 'Hải Sản Bé Mặn', area: 'Võ Nguyên Giáp, Mỹ Khê beach', dish: 'Pick-from-the-tank seafood', en: 'Prawns, clams, squid, grilled or steamed', note: 'Big beachfront tables suit all seven of you. Popular with local families on weekends.', tags: ['parents','raffy','beach'] },
    { city: 'dad', meal: 'd', place: 'Bún Mắm Vân', area: 'Alley 23 Trần Kế Xương, Hải Châu', dish: 'Bún mắm nêm', en: 'Vermicelli, pork and fermented anchovy sauce', note: 'For the adventurous. A true local taste that the parents will probably adore.', tags: ['parents','adults'] },
    { city: 'dad', meal: 'b', place: 'Bánh Canh Nga', area: 'Nguyễn Chí Thanh, Hải Châu', dish: 'Bánh canh chả cá', en: 'Thick tapioca noodles with fish cake', note: 'A breakfast queue of office workers and families most mornings. Silky noodles in a peppery fish broth.', tags: ['raffy','parents'] },

  // [city, category, name, what, tags, tip]
  activities: [
    // Saigon
    ['hcm','relax','Miu Miu Spa','Locally loved, good-value massage. Book a 90-minute session the day you land to undo the overnight flight.',['parents'],'Branches in District 1 and 3. Book a day ahead.'],
    ['hcm','relax','Café apartments, 42 Nguyễn Huệ','An old apartment block with a café on every floor. Pick a balcony over the walking street and watch the city go by.',['parents','easy'],'Small lift (paid). The upper floors have the best views.'],
    ['hcm','active','Mekong Delta day trip','Sampan rides through coconut canals, honey farms and coconut-candy workshops around Bến Tre. About 2 hours each way.',['raffy','parents'],'Book a private car and guide for all seven. It is much easier with a toddler.'],
    ['hcm','active','Cu Chi Tunnels','Crawl through the wartime tunnel network and see the hidden trapdoors. A half-day trip.',['adults'],'Go to Ben Duoc, as it is less crowded than Ben Dinh.'],
    ['hcm','sights','Independence Palace','The 1960s palace where the war ended, frozen in time: war rooms, a rooftop helipad and tanks on the lawn.',['parents','easy'],'The grounds are flat and good for strollers.'],
    ['hcm','sights','Jade Emperor Pagoda','Incense-filled Taoist temple full of carved deities. Locals come here to pray for children.',['parents'],'Free. Dress modestly.'],
    ['hcm','sights','War Remnants Museum','Powerful and confronting. The most important museum in the city for understanding the war.',['adults'],'Some rooms are graphic, so take Raffy for a walk outside.'],
    ['hcm','raffy','Saigon Zoo & Botanical Gardens','One of the oldest zoos in Asia. Shady, flat, with elephants, giraffes and big trees.',['raffy','easy'],'Go at 8am opening before the heat.'],
    ['hcm','raffy','Đầm Sen Water Park','Pools, slides and a big kids\' splash zone, where Saigon families go on weekends.',['raffy'],'Pack swim nappies.'],
    ['hcm','raffy','tiNiWorld indoor play','Vietnam\'s favourite indoor playground chain, inside the big malls. Air-conditioned and safe.',['raffy','easy'],'A good rainy-afternoon backup.'],
    ['hcm','shop','Bình Tây Market','Cholon\'s grand old wholesale market, newly restored. Dried fruit, tea, spices and ceramics at local prices.',['parents'],'The parents can haggle. Go in the morning.'],
    ['hcm','shop','Ben Thanh Market','The classic. Coffee, lacquerware, fabric and souvenirs, with a food hall inside.',['parents','easy'],'Agree a price before you pay.'],
    ['hcm','shop','Saigon Centre / Takashimaya','A polished mall with air-conditioning, a basement food hall and Vietnamese brands.',['easy','raffy'],'Good for rainy hours and clean toilets.'],
    ['hcm','taste','Saigon coffee crawl','Sock-filtered coffee in an alley at Cheo Leo, coconut coffee at Cộng Cà Phê, and a salted coffee to finish. Saigon runs on coffee.',['parents','easy'],'Spread over a morning, with plenty of stops to sit down.'],
    ['hcm','taste','Chè dessert crawl in Cholon','Sweet soups, jellies and grass jelly in Chinatown. Chè Hà Ký is a long-time favourite with Saigon families.',['raffy','parents'],'An easy afternoon treat that Raffy can share.'],
    ['hcm','taste','Tropical fruit tasting','Pick a bag of fruit at a local market and taste your way through: rambutan, dragon fruit, mangosteen, pomelo and, for the brave, durian.',['raffy','easy'],'Amanda\'s parents will know which stalls have the best fruit.'],
    ['hcm','night','Nguyễn Huệ walking street','A wide pedestrian boulevard where Saigon families stroll, buskers play and kids ride toy cars.',['raffy','easy'],'Best after 7pm.'],
    ['hcm','night','Rooftop drinks','Watch the skyline at Chill Skybar, or at the calmer Social Club rooftop at Hôtel des Arts.',['adults'],'Smart casual. No thongs at Chill.'],
    ['hcm','local','Tao Dan Park bird café','Retired men hang their songbird cages in the trees and sip coffee while the birds sing.',['parents','easy'],'Early morning only, best on Sundays.'],
    ['hcm','local','Cholon temples','Thiên Hậu Temple and its giant incense coils, in the heart of Chinatown.',['parents','easy'],'Pair it with Bình Tây Market.'],
    // Da Nang
    ['dad','relax','Sunrise swim at Mỹ Khê','Locals swim at 5–6am before work. Join them for warm water and a pink sky.',['beach','parents'],'Check the flags, as seas can be rough in November.'],
    ['dad','relax','Charm Spa Grand','A well-reviewed, good-value spa near the Han river with family-sized rooms.',['parents'],'Book ahead for a group.'],
    ['dad','active','Hải Vân Pass drive','The famous coastal mountain road north of the city. Stop at the top for the view, then have lunch at Lăng Cô lagoon.',['parents'],'Private car or jeep tour. Only on a clear day.'],
    ['dad','active','Ba Na Hills & Golden Bridge','Record-breaking cable car up to the bridge held by giant stone hands, plus a French village and rides.',['raffy','parents'],'A full day, and cloud often hides it in November. Go on the clearest morning.'],
    ['dad','active','Son Tra peninsula','Wind up the jungle road to spot rare red-shanked douc langurs, the "costumed apes".',['parents'],'Early morning is best for monkeys.'],
    ['dad','sights','Marble Mountains','Five limestone hills with caves, shrines and pagodas inside. Huyền Không cave is magical.',['parents'],'Use the lift on Thủy Sơn to skip the steep stairs.'],
    ['dad','sights','Museum of Cham Sculpture','The world\'s best collection of Cham art, from Hindu kingdoms over 1,000 years old.',['parents','easy'],'Indoors, so a great rain plan.'],
    ['dad','sights','Lady Buddha & Linh Ứng Pagoda','A 67 m white statue looking over the bay, with views back to the city.',['parents','easy'],'Drive right up.'],
    ['dad','raffy','Mikazuki Water Park 365','A huge indoor, heated Japanese-style water park. It works whatever the weather.',['raffy'],'Your best rainy-day rescue in Da Nang.'],
    ['dad','raffy','Asia Park / Sun World','A big Ferris wheel (the Sun Wheel), gentle rides and a lit-up park at night.',['raffy','easy'],'Opens late afternoon. Go after the nap.'],
    ['dad','shop','Hàn Market','Locals buy dried squid, coffee, cashews and fabric here. Upstairs is packed with clothing stalls, including plenty of copy brands.',['parents'],'Upstairs also has tailors. Bargain for the clothes.'],
    ['dad','shop','Non Nước marble village','Stone carvers at the foot of the Marble Mountains, making everything from tiny Buddhas to lions.',['parents'],'Small pieces travel fine. They can ship big ones.'],
    ['dad','night','Dragon Bridge fire show','The bridge breathes fire and water at 9pm on Saturday and Sunday nights.',['raffy','easy'],'Watch from the east bank, or a riverside café.'],
    ['dad','night','Helio night market','A local night market with food stalls and live music, next to Asia Park.',['raffy','easy'],'Combine with the Sun Wheel.'],
    ['dad','local','Cồn Market','A real neighbourhood market. Try the food hall and buy bánh khô mè (sesame crisps), the Da Nang gift to bring home.',['parents'],'Mornings are liveliest.'],
    // Hoi An
    ['hoi','relax','An Bàng beach','A quieter beach 10 minutes from the old town, with sunloungers, beach bars and seafood shacks.',['beach','raffy'],'Come late afternoon after the old town.'],
    ['hoi','relax','Reaching Out Tea House','A silent tea house staffed by people with hearing and speech impairments. Calm and beautiful.',['parents','easy'],'Order with the little word blocks on the table.'],
    ['hoi','relax','Palmarosa Spa','Many visitors rate it the best spa in Hoi An, set in a garden near the old town.',['parents'],'Book a day or two ahead.'],
    ['hoi','active','Cycle to Trà Quế herb village','A flat ride through rice paddies to a farming village where herbs are grown in seaweed-fed beds.',['parents'],'Hotels lend bikes, and some have child seats.'],
    ['hoi','active','Mỹ Sơn Sanctuary','Jungle-covered Cham temple ruins in a mountain valley. A UNESCO site that predates Angkor.',['parents'],'Go at 6am opening to beat the heat and crowds.'],
    ['hoi','sights','Old town & Japanese Bridge','Mustard-yellow merchant houses, assembly halls and the 400-year-old covered bridge.',['parents','easy'],'Buy one ticket for 5 heritage houses. The old town is car-free, so it\'s great for a stroller.'],
    ['hoi','sights','Hội An Memories show','A huge open-air show on a river island, with hundreds of performers telling 400 years of Hoi An history.',['parents','raffy'],'About an hour. Check show nights.'],
    ['hoi','raffy','Coconut basket boats','Spinning bamboo boats in the water palms, and the boatmen do tricks.',['raffy'],'Pick a quieter operator further up the river.'],
    ['hoi','raffy','Lantern-making workshop','Build your own silk lantern in an hour and take it home flat-packed.',['raffy','parents'],'A great souvenir.'],
    ['hoi','raffy','VinWonders Nam Hội An','River safari, animals, a water park and a theme park, 30 minutes south.',['raffy'],'A full day out.'],
    ['hoi','shop','Yaly Couture','One of Hoi An\'s best-known tailors, with in-house master tailors for suits, dresses and áo dài. Bring a photo of any designer piece and they can recreate it.',['parents','adults'],'Among the pricier shops, but consistent. Order on day one so there\'s time for two fittings.'],
    ['hoi','shop','Bebe Tailor','Popular with travellers for speed: simple pieces can be ready in a few hours, suits in a day or two.',['parents','adults'],'Good if you\'re only in Hoi An for a day trip.'],
    ['hoi','shop','A Dong Silk','A long-running tailor with hundreds of glowing online reviews, praised for clear communication and quick turnaround.',['parents','adults'],'They can also ship finished pieces home.'],
    ['hoi','shop','Kimmy Tailor','Family tailoring since the 1970s, mixing international cuts with Vietnamese craft. A favourite for men\'s suits and shirts.',['parents','adults'],'Ask for half-canvas construction on suits for a better drape.'],
    ['hoi','shop','Copy outdoor & sportswear shops','Hoi An is known for cheap copy hiking jackets, backpacks and sportswear, sold in shops along the streets around the old town and the night market.',['adults','parents'],'Quality varies a lot, so check zips and seams. Australian customs can seize counterfeit goods.'],
    ['hoi','shop','Hội An Central Market','Silk, lanterns, spices and coffee beans by the river.',['parents','easy'],'Bargain gently.'],
    ['hoi','taste','Bánh mì showdown','Grab one from Bánh Mì Phượng and one from Madam Khánh, then let the family vote on the best.',['raffy','parents','easy'],'A fun, cheap lunch to share on a bench.'],
    ['hoi','taste','Central Market food stalls','The covered food hall inside Hội An Central Market, with cao lầu, mì Quảng and chè at local prices.',['parents','easy'],'Best at breakfast or lunch, when it is busiest.'],
    ['hoi','night','Lantern boat on the Thu Bon','Float a candle lantern on the river after dark. The trip\'s signature photo.',['raffy','parents','easy'],'About 150,000₫ per boat. Haggle.'],
    ['hoi','local','Thanh Hà pottery village','Riverside potters still use hand-turned wheels. Kids can try shaping clay.',['raffy','parents'],'A short ride out of town.'],
    // Phu Quoc
    ['pqc','relax','Sao Beach','Powder-white sand and very calm, shallow water. The best toddler beach on the island.',['raffy','beach'],'Weekday mornings are quietest.'],
    ['pqc','relax','Sunset at Ông Lang','A quieter west-coast stretch with low-key beach bars, perfect for sundowners.',['beach','parents'],'Sunset is about 5:30pm.'],
    ['pqc','active','An Thới islands boat trip','Island hopping and snorkelling over coral in the south. November is the start of the clear-water season.',['beach','parents'],'Book a private boat with life jackets for a toddler.'],
    ['pqc','active','Night squid fishing','Head out at dusk with a local boat, drop lit lines for squid, and they grill your catch on board.',['adults','parents'],'A real highlight. Calm seas in November.'],
    ['pqc','active','Hòn Thơm cable car','7.9 km over the sea, one of the longest cable cars in the world, with a beach and water park at the top.',['raffy','parents'],'Go in the morning.'],
    ['pqc','sights','Hộ Quốc Pagoda','A beautiful seaside temple on the cliffs of the east coast.',['parents','easy'],'Free. Dress modestly.'],
    ['pqc','sights','Dinh Cậu shrine at sunset','A small shrine on the rocks at the mouth of Dương Đông river, loved by fishermen.',['parents','easy'],'Walk on to the night market afterwards.'],
    ['pqc','raffy','Vinpearl Safari','Vietnam\'s biggest safari park. A bus safari, giraffe feeding and open-air animal areas.',['raffy','parents'],'Go at opening, about 9am.'],
    ['pqc','raffy','VinWonders Phú Quốc','A theme park with a big aquarium, gentle rides and evening shows, next to the Safari.',['raffy'],'Combo tickets with the Safari save money.'],
    ['pqc','raffy','Starfish beach (Rạch Vẹm)','Shallow water full of big orange starfish. Look, don\'t lift.',['raffy','beach'],'North of the island. Have lunch at a stilt restaurant there.'],
    ['pqc','shop','Pepper farm & fish sauce house','See how the island\'s famous pepper and nước mắm are made. Buy direct.',['parents','easy'],'Fish sauce can\'t go on planes, so buy pepper instead.'],
    ['pqc','shop','Dương Đông market','The island\'s local market: dried seafood, sim wine and tropical fruit.',['parents'],'Morning only.'],
    ['pqc','night','Kiss of the Sea show','A water, fire and laser show at Sunset Town with the Kiss Bridge glowing behind.',['raffy','parents'],'Check show nights and book seats.'],
    ['pqc','night','Grand World by night','Venice-style canals, gondolas and lantern streets all lit up, with free shows.',['raffy','easy'],'Free to enter.'],
    ['pqc','local','Hàm Ninh fishing village','A stilt-house village on the east coast. Watch the boats come in, then eat crab on the pier.',['parents'],'Pair it with Sao Beach.'],
    // Tailors & shoemakers
    ['hcm','shop','Phan\'s Custom Tailor','A long-time favourite in District 1 with one of the highest review scores of any Saigon tailor. Suits, shirts and dresses.',['parents','adults'],'Two-piece suits around US$200–300. Allow a few days with a fitting, which works with your 3 nights at the end.'],

    ['dad','shop','Paul Bespoke Tailoring','Da Nang\'s best-known bespoke tailor (17A Hùng Vương), trusted for suits since 2015.',['adults','parents'],'Ask for half- or full-canvas construction. Allow 2–3 days with a fitting.'],
    ['dad','shop','Ly\'s Tailor','A well-priced tailor often named alongside Paul Bespoke for good-value suits and dresses.',['adults','parents'],'Skip the rushed "tailors" at Hàn Market and tour-bus stops.'],
    // Massages near our hotels
    ['hcm','relax','Quỳnh Như 137 Foot Massage','Huge, hugely popular foot and body massage across from Ben Thanh, a short walk from Central Palace.',['parents','easy'],'The real one is at 147–149 Hàm Nghi. Several copycats use "137". 90 minutes in a shared room is about 500,000₫.'],
    ['hcm','relax','22 Spa','A value favourite near Ben Thanh, with body and foot massages at budget prices.',['parents'],'Book ahead, as it gets busy. They also store luggage.'],

    ['hcm','relax','Glow Spa','Highly rated spa on Nguyễn Huệ, right by The Prince. A great end to a day of walking.',['parents','easy'],'Foot massage about 490,000₫ for 60 minutes.'],
    ['dad','relax','Vie Spa at the Hyatt','The resort\'s own spa, with steam rooms and outdoor baths. No travel needed.',['parents'],'Resort prices, so save it for one treat.'],

    ['hoi','relax','Nari Spa','Loved for affordable, really good massages, and they often run 2-for-1 deals.',['parents','easy'],'Ask about the current offer when you book.'],
    ['pqc','relax','Little Win Spa','Cheap and very well reviewed, at 114 Trần Hưng Đạo near Lahana. A 90-minute aroma massage is about 490,000₫.',['parents','easy'],'Open 7am–11pm, so it works after the beach.'],
    ['pqc','relax','Phu Quoc Day Spa & Massage','Rated 4.7 by guests, at 100/3 Trần Hưng Đạo. The shampoo-and-massage combo is a favourite.',['parents'],'Staff speak limited English, so point to the menu.'],
    ['pqc','relax','Fiona Spa','One of the highest-rated spas on the island, at 20 Trần Hưng Đạo in Dương Đông.',['parents'],'A short ride from Lahana.'],
    // More Saigon
    ['hcm','relax','The Workshop Coffee','A calm, airy specialty coffee loft above the street in District 1, with big windows and slow mornings.',['parents','easy'],'Up a flight of stairs. Leave the stroller at the bottom.'],
    ['hcm','relax','Sunset at Thủ Thiêm riverside','The grassy riverside park across the water, looking back at the whole District 1 skyline as the lights come on.',['raffy','easy'],'Space for Raffy to run around. Bring snacks.'],
    ['hcm','active','Cần Giờ mangrove forest','A UNESCO biosphere of mangroves south of the city, explored by boat, with cheeky monkeys on Monkey Island.',['raffy','parents'],'About 2 hours each way. A private car makes it easy.'],
    ['hcm','active','Day trip to Vũng Tàu','The beach town where Saigon escapes on weekends: seafood, a giant Christ statue on the headland and sea breezes.',['beach','parents'],'About 2 hours by car, or a fast boat from the city.'],
    ['hcm','sights','Central Post Office & Notre-Dame','The grand French post office with painted maps, next to the red-brick cathedral.',['parents','easy'],'Send postcards home from the post office counters.'],
    ['hcm','raffy','Saigon river water bus','A cheap, air-conditioned riverboat. Toddlers love watching the boats and bridges go by.',['raffy','easy'],'Board at Bạch Đằng pier. Sunset is the best time.'],
    ['hcm','shop','Saigon Square','The best-known copy-goods mall in the city: rows of stalls packed with knock-off sportswear, designer-style clothes, bags, sunglasses and shoes.',['parents','adults'],'Haggle hard, starting around half the asking price. Australian customs can seize counterfeit items, so keep it to a few pieces for personal use.'],
    ['hcm','shop','An Đông Market','A big wholesale clothing market in District 5 where locals shop. Cheap copies and Vietnamese-made clothing by the floor.',['parents'],'Mornings are calmer. The parents will do better at bargaining.'],
    ['hcm','shop','Book Street','A shady pedestrian lane of bookshops and cafés beside the post office, including kids\' picture books.',['raffy','easy'],'Nice for a slow coffee while Raffy browses.'],
    ['hcm','taste','Bến Thành Street Food Market','An evening food hall with dozens of stalls under one roof. Everyone can pick something different.',['raffy','easy'],'Seats for a big group, and it is covered if it rains.'],
    ['hcm','night','Saigon river dinner cruise','Dinner on a boat while the city lights slide past.',['parents','raffy'],'Book a day or two ahead for seven.'],
    ['hcm','night','Turtle Lake snacks','Young Saigonese gather around the Hồ Con Rùa roundabout at night for bánh tráng nướng, the "Vietnamese pizza".',['easy'],'Cheap, casual, and very local.'],
    ['hcm','local','Hồ Thị Kỷ flower market at dawn','An alley wholesale flower market buzzing before sunrise as florists load up.',['parents'],'Best before 7am.'],
    ['hcm','local','Tân Định pink church & market','The bubblegum-pink church, then the neighbourhood market across the road where locals shop.',['parents','easy'],'Great photos in the morning light.'],
    // More Da Nang
    ['dad','relax','Pool day at the Hyatt','Big pools, beach loungers and the sea right in front. Sometimes the best day is not leaving the resort.',['raffy','beach','easy'],'A good fit for a rainy-ish or tired day.'],
    ['dad','relax','Tiên Sa beach','A quiet cove on the Son Tra peninsula, far calmer than the city beaches.',['beach','parents'],'Pair it with the Lady Buddha drive.'],
    ['dad','active','Surf lesson at Mỹ Khê','November brings the best waves of the year, and local surf schools run beginner lessons.',['adults','beach'],'Only on days with safe conditions. Check with the school.'],
    ['dad','sights','Da Nang pink cathedral','The French-era cathedral, painted candy pink and nicknamed the "chicken church" for its weathercock.',['parents','easy'],'In the city centre, near Hàn Market.'],
    ['dad','raffy','Fantasy Park at Ba Na Hills','A big indoor play park at the top of the cable car, with rides and games.',['raffy'],'Included in the Ba Na Hills ticket. Handy if the clouds roll in on top of the mountain.'],
    ['dad','raffy','Art in Paradise 3D museum','Giant optical-illusion paintings you can step into for silly photos. Air-conditioned and fun for all ages.',['raffy','easy'],'About an hour. A good rainy-day pick.'],
    ['dad','shop','Lotte Mart','Where locals stock up on coffee, dried fruit, snacks and sauces. Easy gifts at supermarket prices.',['easy','parents'],'Air-conditioned, with a food court.'],
    ['dad','shop','Vincom Plaza','A modern mall by the river with Vietnamese brands, a cinema and an indoor play area.',['raffy','easy'],'A good rainy-afternoon backup.'],
    ['dad','night','Sơn Trà night market','A local night market near the Dragon Bridge with grilled seafood, sugarcane juice and cheap souvenirs.',['raffy','easy'],'Goes well with the weekend fire show.'],
    ['dad','night','Sky36 rooftop','Drinks at one of the highest bars in Vietnam, with views over the river and bridges.',['adults'],'Smart casual dress.'],
    ['dad','local','Thọ Quang fish market at dawn','Fishing boats unload at the port under Son Tra, and the trading is loud and fast.',['parents'],'Be there before 6am.'],
    ['dad','local','Nam Ô fish sauce village','A centuries-old fishing village still making nước mắm in big wooden barrels.',['parents'],'Quick to visit on the way to the Hải Vân Pass.'],
    ['dad','local','Dawn on the Hàn riverbank','At sunrise, locals fill the riverside promenade with tai chi, dance aerobics and badminton.',['parents','easy'],'Join in, or just watch with a coffee.'],
    // More Hoi An
    ['hoi','relax','Faifo Coffee rooftop','A rooftop café with one of the best views over the old town\'s mossy tiled roofs.',['parents','easy'],'Go late afternoon as the lanterns start to glow.'],
    ['hoi','active','Sunrise kayak on the Thu Bon','A gentle paddle past fishing boats and water palms as the town wakes up.',['adults','parents'],'Calm water, but go only if the river is not flooded.'],
    ['hoi','active','Cù Lao Chàm islands','A marine park off the coast with snorkelling and a quiet fishing village.',['beach','parents'],'Boats often cancel in rough November seas. Treat it as a maybe.'],
    ['hoi','sights','Tân Ký Old House','A 200-year-old merchant\'s house with dark carved wood, still lived in by the same family.',['parents','easy'],'Included in the old town ticket.'],
    ['hoi','sights','Phúc Kiến Assembly Hall','The most ornate of the Chinese assembly halls, with dragons, incense coils and a lovely courtyard.',['parents','easy'],'Included in the old town ticket.'],
    ['hoi','raffy','Water buffalo in the rice fields','Farmers near Cẩm Thanh let kids meet and sit on their gentle buffalo.',['raffy'],'Pair it with the basket boats.'],
    ['hoi','shop','Friendly Shoe Shop','Made-to-measure shoes at 18 Trần Phú: pick a style and leather, and they measure each foot. Loafers, boots, sandals, and copies of sneakers you love.',['parents','adults'],'Feel the leather before you order, as quality varies a lot around town. Allow a day or two plus a fitting.'],
    ['hoi','shop','09 Shoes','Another recommended custom shoemaker, on Trần Hưng Đạo, for leather shoes and boots fitted to your feet.',['parents','adults'],'Compare a quote here with Friendly Shoe Shop.'],
    ['hoi','shop','Reaching Out Arts & Crafts','A fair-trade shop where artisans with disabilities make jewellery, textiles and homewares.',['parents','easy'],'Next to the Japanese Bridge end of town.'],
    ['hoi','taste','White Rose dumplings','The family kitchen that makes Hoi An\'s delicate "white rose" shrimp dumplings for the whole town.',['raffy','parents'],'Watch them being folded by hand.'],
    ['hoi','taste','Nước Mót herbal tea','A tiny stall famous for its lemongrass, lotus and herb iced tea, served with a fresh leaf.',['raffy','easy'],'On Phan Châu Trinh, perfect mid-walk.'],
    ['hoi','night','Bài Chòi folk game','Evening singing bingo by the river, a UNESCO-listed folk game where performers sing out the cards.',['raffy','parents','easy'],'Free to watch. Buy a card to play along.'],
    ['hoi','night','Night market & lantern streets','Across the bridge on An Hội: lantern stalls, snacks and the river glowing below.',['raffy','easy'],'Busiest 7 to 9pm.'],
    ['hoi','night','Riverside drinks at sunset','A drink at one of the riverfront bars on An Hội as the boats light up.',['adults','parents'],'Grab a front table before 5:30pm.'],
    ['hoi','local','Cẩm Kim island & Kim Bồng carpenters','A short ferry to a quiet island where carpenters still build boats and carve wood by hand.',['parents'],'Rent bikes and loop the island.'],
    ['hoi','local','Riverside fish market at dawn','Boats land the night\'s catch at the old market\'s riverside as Hoi An wakes up.',['parents'],'Before 6:30am.'],
    ['hoi','local','Phước Kiều bronze village','A village of gong-casters who make bronze gongs and bells for temples across Vietnam.',['parents'],'A short drive north of Hoi An.'],
    // More Phu Quoc
    ['pqc','relax','Sunset Sanato beach club','A beach club with giant sculptures standing in the shallows. Loungers, sand and a spectacular sunset.',['beach','raffy'],'Entry includes a drink. Arrive by 5pm.'],
    ['pqc','relax','Bãi Khem','A soft-sand bay in the south that is often called the island\'s most beautiful beach.',['beach','parents'],'Pair it with the cable car day.'],

    ['pqc','shop','Pearl farm','See how Phu Quoc pearls are cultured and buy direct.',['parents','easy'],'Ask for certificates on bigger pieces.'],

    ['pqc','night','Tinh Hoa Việt Nam show','A big open-air show at Grand World telling Vietnam\'s history with music, dance and water effects.',['raffy','parents'],'Check show times and arrive early for seats.'],

    ['pqc','local','An Thới port at dawn','Fishing boats return to the island\'s southern port with the night\'s catch.',['parents'],'Before 6am, near the cable car station.'],
    ['pqc','local','Dương Đông harbour at sunset','Colourful fishing boats bob in the river mouth while families gather on the waterfront.',['raffy','easy'],'Walk on to the night market.'],

    ['dad','drinks','Sunset at the Hyatt\'s beach bar','No travel needed: feet in the sand with a cocktail as the sky goes pink over Non Nước beach.',['parents','raffy','easy'],'Easy with Raffy, since you\'re already home.'],
    ['hoi','drinks','Soul Kitchen, An Bàng','A laid-back beach bar on the sand at An Bàng, with bean bags, live music and sea breezes.',['adults','parents','beach'],'Sunday afternoons are lively.'],

function heroCountdown() {
  const now = new Date(), ms = TRIP.depart - now;
  const today = ymd(new Date(now.getTime() + 7 * 3600e3)); // Vietnam date
  if (ms > 0) {
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return `<div class="count"><div><b>${d}</b><span>days</span></div><div><b>${h}</b><span>hours</span></div><div><b>${m}</b><span>mins</span></div></div>
      <small>to go until your holiday!</small>`;
  }
  const st = TRIP.stages.find(s => today >= s.start && today < s.end);
  if (st) return `<small>Today you're in</small><h2 style="color:#fff">${st.city}</h2>`;
  return `<small>Welcome home. Hope Raffy slept on the plane.</small>`;
}

function stageNow(s) {
  const today = ymd(new Date(Date.now() + 7 * 3600e3));
  return today >= s.start && today < s.end;
}

function wxCard(p, data) {
  const c = p.clim;
  let live = '';
  if (data && data.daily) {
    const d = data.daily, cur = data.current || {};
    const [label, icon] = wxCode(cur.weather_code ?? d.weather_code[0]);
    live = `
      <div class="wx-now">
        ${wxIco(icon, 'big')}
        <div><div class="wx-temp">${Math.round(cur.temperature_2m ?? d.temperature_2m_max[0])}°</div><div class="muted">${label}${cur.relative_humidity_2m != null ? ` · ${cur.relative_humidity_2m}% humidity` : ''}</div></div>
      </div>
      <div class="wx-days" role="list">${d.time.map((t, i) => {
        const [lb, ic] = wxCode(d.weather_code[i]), dt = new Date(t + 'T00:00:00'), here = inStay(p, t);
        return `<div class="wx-day${here ? ' here' : ''}" role="listitem" title="${lb}">
          <span class="wx-dow">${dt.toLocaleDateString('en-AU', { weekday: 'short' })}</span>
          <span class="wx-date">${dt.getDate()}/${dt.getMonth() + 1}</span>
          ${wxIco(ic)}
          <b>${Math.round(d.temperature_2m_max[i])}°</b><span class="muted">${Math.round(d.temperature_2m_min[i])}°</span>
          <span class="wx-rain">${d.precipitation_probability_max[i] ?? 0}%</span>
        </div>`; }).join('')}</div>
      <p class="wx-legend"><span class="wx-key"></span>Your days here · % is chance of rain</p>`;
  }
  return `<details class="card spot wx-card" open>
    <summary><span class="sum"><h3>${p.name} <span class="vn">${p.vn}</span></h3><span class="muted">You're here ${stayText(p)}</span></span>${chev}</summary>
    <div class="spot-body">
      ${live || `<p class="muted wx-off">Live forecast unavailable here. Showing typical November weather.</p>`}
      <div class="wx-clim"><span class="eyebrow">Typical November</span><p><b>${c.lo}–${c.hi}°C</b> · ${c.rain}</p><p class="muted">${c.note}</p></div>
    </div>
  </details>`;
}

// Last date the live forecast covers (from the saved forecast, else today + 15 days)
function wxHorizon() {
  const c = store.get('wx', null), days = c && c.data && c.data[0] && c.data[0].daily && c.data[0].daily.time;
  const last = days ? new Date(days[days.length - 1] + 'T00:00:00') : new Date(Date.now() + 15 * 864e5);
  return last.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}

async function fetchWeather() {
  const q = k => WX_PLACES.map(p => p[k]).join(',');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${q('lat')}&longitude=${q('lon')}&current=temperature_2m,weather_code,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=16`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('weather ' + res.status);
  const j = await res.json();
  const data = Array.isArray(j) ? j : [j];
  store.set('wx', { at: Date.now(), data });
  return data;
}

function wireWeather() {
  const btn = $('#wx-refresh'), status = $('#wx-status');
  const pull = async () => {
    btn.disabled = true; status.textContent = 'Checking the forecast…';
    try {
      const data = await fetchWeather();
      $('#wx-list').innerHTML = WX_PLACES.map((p, i) => wxCard(p, data[i])).join('');
      status.textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    } catch (e) {
      status.textContent = store.get('wx', null) ? 'Couldn\'t refresh. Showing the last forecast.' : 'Couldn\'t reach the forecast. Showing typical weather.';
    } finally { btn.disabled = false; }
  };
  btn.addEventListener('click', pull);
  const c = store.get('wx', null);
  if (!c || Date.now() - c.at > 3600e3) pull();
}

// Text to speech with the device's own voices (Web Speech API). Vietnamese needs a vi-VN voice on the phone.
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function';
function speak(text, lang) {
  if (!canSpeak || !text) return;
  try {
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'vi' ? 'vi-VN' : 'en-AU';
    const voices = synth.getVoices();
    const v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(lang));
    if (v) u.voice = v;
    else if (lang === 'vi' && voices.length) toast('No Vietnamese voice on this device. Add one in your phone\'s text-to-speech settings.');
    u.rate = 0.9;
    synth.speak(u);
  } catch (e) { toast('Speech isn\'t available here.'); }
}
const listenUrl = (text, lang) => `https://translate.google.com/?sl=${lang}&tl=${lang === 'vi' ? 'en' : 'vi'}&op=translate&text=${encodeURIComponent(text)}`;
if (canSpeak) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {} }

function wireTranslator() {
  const box = $('#tr-in'), go = $('#tr-go'), out = $('#tr-out'), txt = $('#tr-text'), note = $('#tr-note'), gl = $('#tr-g');
  if (!box) return;
  let dir = 'en', ctl = null;
  const say = m => { note.textContent = m; note.hidden = !m; };
  const syncLink = () => {
    const [sl, tl] = dir === 'en' ? ['en', 'vi'] : ['vi', 'en'];
    gl.href = `https://translate.google.com/?sl=${sl}&tl=${tl}&op=translate&text=${encodeURIComponent(box.value.trim())}`;
    box.placeholder = dir === 'en' ? 'e.g. Can we have a table for seven, with a high chair?' : 'Dán hoặc gõ tiếng Việt ở đây…';
  };
  document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => {
    dir = b.dataset.dir;
    document.querySelectorAll('[data-dir]').forEach(x => x.setAttribute('aria-pressed', x === b));
    out.hidden = true; say(''); syncLink();
  }));
  box.addEventListener('input', syncLink);
  go.addEventListener('click', async () => {
    const text = box.value.trim(); if (!text) { box.focus(); return; }
    const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if (!sample) { say('Live translation is only available when the app is opened in Claude. Use Google Translate instead.'); return; }
    if (ctl) ctl.abort();
    ctl = new AbortController();
    go.disabled = true; out.hidden = false; txt.className = 'muted'; txt.textContent = 'Translating…'; say('');
    const prompt = dir === 'en'
      ? `Translate this into natural, polite spoken Vietnamese (southern Vietnam usage) that a tourist can show or say to a local. Reply with only the Vietnamese, no notes or romanisation.\n\n${text}`
      : `Translate this Vietnamese into natural English. Reply with only the English, no notes.\n\n${text}`;
    try {
      await sample(prompt, { modelTier: 'quick', signal: ctl.signal, onText: ({ text: t }) => { txt.className = dir === 'en' ? 'vn tr-big' : 'tr-big'; txt.textContent = t; } });
    } catch (e) {
      if (e.code === 'cancelled') return;
      txt.textContent = e.text || ''; if (!e.text) out.hidden = true;
      say(e.code === 'not_granted' || e.code === 'sampling_disabled' ? 'Translation wasn\'t allowed here. Use Google Translate instead.'
        : e.code === 'rate_limited' ? 'Too many translations just now. Try again in a minute.'
        : 'Couldn\'t translate that. Try again, or use Google Translate.');
    } finally { go.disabled = false; }
  });
  // Speak: the page can't use the microphone itself, so open the keyboard for its built-in voice typing
  $('#tr-mic').addEventListener('click', () => {
    box.focus();
    toast(dir === 'en' ? 'Tap the 🎤 on your keyboard and speak in English' : 'Tap the 🎤 on your keyboard to speak Vietnamese (switch keyboard language if needed)');
  });
  // Always-visible Listen: reads the translation if there is one, otherwise what was typed
  $('#tr-listen').addEventListener('click', e => {
    const hasOut = !out.hidden && txt.textContent && txt.className !== 'muted';
    const text = hasOut ? txt.textContent : box.value.trim();
    const lang = hasOut ? (dir === 'en' ? 'vi' : 'en') : (dir === 'en' ? 'en' : 'vi');
    if (!text) { e.preventDefault(); box.focus(); toast('Type something first'); return; }
    if (canSpeak) { e.preventDefault(); speak(text, lang); }
    else e.currentTarget.href = listenUrl(text, lang);
  });
  const sp = $('#tr-speak'), spl = $('#tr-speak-link');
  sp.hidden = !canSpeak; spl.hidden = canSpeak;
  sp.addEventListener('click', () => speak(txt.textContent, dir === 'en' ? 'vi' : 'en'));
  // Where the viewer has no built-in speech (e.g. some in-app browsers), open the text in Google Translate to use its speaker button
  spl.addEventListener('click', () => { spl.href = listenUrl(txt.textContent, dir === 'en' ? 'vi' : 'en'); });
  $('#tr-copy').addEventListener('click', () => {
    const t = txt.textContent;
    try { navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast(t)); } catch (e) { toast(t); }
  });
}

function wireKit() {
  wireTranslator();
  const aud = $('#aud'), vnd = $('#vnd'), rateEl = $('#rate'), prices = $('#prices');
  const num = s => parseFloat(String(s).replace(/[^0-9.]/g, '')) || 0;
  const rate = () => num(rateEl.value) || 18100;
  const refresh = () => prices.innerHTML = priceRef(rate());
  aud.addEventListener('input', () => vnd.value = Math.round(num(aud.value) * rate()).toLocaleString('en-AU'));
  vnd.addEventListener('input', () => aud.value = (num(vnd.value) / rate()).toFixed(2));
  rateEl.addEventListener('input', () => { store.set('rate', rate()); store.set('rateAt', null); $('#rate-status').textContent = 'Using your own rate'; aud.dispatchEvent(new Event('input')); refresh(); });
  const status = $('#rate-status'), btn = $('#rate-refresh');
  const pull = async () => {
    btn.disabled = true; status.textContent = 'Checking live rate…';
    const r = await fetchLiveRate();
    btn.disabled = false;
    if (r) { rateEl.value = Math.round(r); aud.dispatchEvent(new Event('input')); refresh(); status.textContent = rateStatus(); }
    else status.textContent = 'Couldn\'t reach the live rate. Using the last saved rate.';
  };
  btn.addEventListener('click', pull);
  // Refresh quietly when the saved rate is more than 6 hours old
  const at = store.get('rateAt', 0);
  if (!at || Date.now() - at > 6 * 3600e3) pull();
  refresh();
}

// Live AUD→VND rate from free, no-key exchange-rate feeds (works on mobile data or wifi;
// blocked inside the claude.ai viewer, where the saved or typed rate is used instead).
const RATE_SOURCES = [
  ['https://open.er-api.com/v6/latest/AUD', j => j && j.rates && j.rates.VND],
  ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/aud.json', j => j && j.aud && j.aud.vnd]
];
async function fetchLiveRate() {
  for (const [url, pick] of RATE_SOURCES) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) continue;
      const v = Number(pick(await res.json()));
      if (v > 1000 && v < 100000) { store.set('rate', Math.round(v)); store.set('rateAt', Date.now()); return v; }
    } catch (e) { /* try the next source */ }
  }
  return null;
}
function rateStatus() {
  const at = store.get('rateAt', 0);
  if (!at) return 'Approximate rate. Tap refresh for the live one.';
  const d = new Date(at);
